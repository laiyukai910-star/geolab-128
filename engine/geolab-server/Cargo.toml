[package]
name = "geolab-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Bounded local HTTP service for the GeoLab 128 Rust computation core"

[dependencies]
axum = { version = "0.8.9", features = ["json"] }
geolab-core = { path = "../geolab-core" }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tower-http = { version = "0.7.0", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
