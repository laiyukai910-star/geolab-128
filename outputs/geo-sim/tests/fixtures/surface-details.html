<script type="module">
import * as THREE from 'three';

const renderer = new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});

document.body.append(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xdce7ea);
scene.add(new THREE.HemisphereLight(0xf2f7ff,0x737969,2));

const n=17;
const terrain = Object.create(TerrainRenderer.prototype);

  activeDetailBudgetPlan:{quality:'ultra',terrainDetailStep:1,maxTerrainDetailInstances:1000,mode:'fixture'},
  model:{n,sizeKm:4,cellSizeKm:0.25,height:Float32Array.from({length:n*n},(_,i)=>400+(i%n)*15),
    slope:new Float32Array(n*n).fill(40),temperature:new Float32Array(n*n).fill(-3),

const kinds=['fractured-rock','talus-cluster','snow-drift'];

const camera=new THREE.PerspectiveCamera(40,1,0.01,100);
const controls=new OrbitControls(camera,renderer.domElement);
function resize(){
