<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {ScannedAssetLibrary} from '../../src/scannedAssets.js';
import {ScannedRockInstances} from '../../src/scannedRockInstances.js';
import {createProceduralGeometry} from '../../src/proceduralAssets.js';
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setClearColor(0xdce5e8);document.body.append(renderer.domElement);
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(38,1,0.01,10000);
scene.add(new THREE.HemisphereLight(0xffffff,0x777c74,2));
const sun=new THREE.DirectionalLight(0xfff6e5,3);sun.position.set(-3,6,4);scene.add(sun);
const library=new ScannedAssetLibrary();
const geometry=createProceduralGeometry('fractured-rock','high',0);

addEventListener('resize',resize);resize();view(false);

 renderer.render(scene,camera);
 const gl=renderer.getContext(),data=new Uint8Array(gl.drawingBufferWidth*gl.drawingBufferHeight*4);
 gl.readPixels(0,0,gl.drawingBufferWidth,gl.drawingBufferHeight,gl.RGBA,gl.UNSIGNED_BYTE,data);
 const colors=new Set();let foreground=0;
 for(let i=0;i<data.length;i+=16){
  colors.add(`${data[i]>>3},${data[i+1]>>3},${data[i+2]>>3}`);
  if(Math.abs(data[i]-data[0])+Math.abs(data[i+1]-data[1])+Math.abs(data[i+2]-data[2])>25)foreground++;
 }
 return {colors:colors.size,foreground,status:library.stats.status,ready:lod.referenceReady,
  near:lod.near.count,far:lod.far.count,detailTriangles:lod.near.geometry.index.count/3,distantTriangles:lod.far.geometry.index.count/3};
}

</script>
