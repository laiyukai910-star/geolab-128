name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-integrity:
    name: Static integrity
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Rust
        shell: bash
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt --no-self-update
          rustup target add wasm32-unknown-unknown --toolchain 1.96.0

      - name: Validate Rust computation core
        run: |
          cargo +1.96.0 fmt --manifest-path engine/Cargo.toml --all -- --check
          cargo +1.96.0 clippy --manifest-path engine/Cargo.toml --workspace --all-targets -- -D warnings
          cargo +1.96.0 test --manifest-path engine/Cargo.toml --workspace

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: outputs/geo-sim-desktop/package-lock.json

      - name: Install desktop dependencies
        run: npm ci --ignore-scripts --prefix outputs/geo-sim-desktop

      - name: Build typed browser bridge and Rust WebAssembly core
        run: |
          npm run typecheck --prefix outputs/geo-sim-desktop
          npm run browser:build --prefix outputs/geo-sim-desktop
          npm run wasm:build --prefix outputs/geo-sim-desktop

      - name: Check JavaScript syntax
        shell: bash
        run: |
          find outputs/geo-sim/src -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check outputs/geo-sim-desktop/build-local.mjs
          node --check outputs/geo-sim-desktop/main.cjs

      - name: Run model-report tests
        run: |
          node outputs/geo-sim/tests/scenarioSynthesis.test.mjs
          node outputs/geo-sim/tests/landscapeEcology.test.mjs
          node outputs/geo-sim/tests/physicalCouplingInterop.test.mjs
          node outputs/geo-sim/tests/backendClient.test.mjs
          node outputs/geo-sim/tests/wasmKernel.test.mjs

      - name: Verify local entry points
        run: |
          test -f outputs/geo-sim/index.html
          test -f outputs/geo-sim/src/main.js
          test -f outputs/geo-sim/src/localization.js
          test -f outputs/geo-sim/src/scenarioSynthesis.js
          test -f outputs/geo-sim/src/physicalCoupling.js
          test -f outputs/geo-sim/src/engineInterop.js
          test -f outputs/geo-sim/src/backendClient.js
          test -f outputs/geo-sim/src/rustKernelWorker.js
          test -f outputs/geo-sim/src/wasmAbi.js
          test -f outputs/geo-sim/src-ts/backendClient.ts
          test -f outputs/geo-sim/src-ts/rustKernelWorker.ts
          test -f outputs/geo-sim/src-ts/wasmAbi.ts
          test -f outputs/geo-sim/vendor/geolab/geolab_core.wasm
          test -f outputs/geo-sim/tests/scenarioSynthesis.test.mjs
          test -f outputs/geo-sim/tests/landscapeEcology.test.mjs
          test -f outputs/geo-sim/tests/physicalCouplingInterop.test.mjs
          test -f outputs/geo-sim/tests/backendClient.test.mjs
          test -f outputs/geo-sim/tests/wasmKernel.test.mjs
          test -f outputs/geo-sim-desktop/package.json
          test -f engine/Cargo.toml
          test -f engine/Cargo.lock
          test -f engine/geolab-core/src/lib.rs
          test -f engine/geolab-core/src/routing.rs
          test -f engine/geolab-core/src/subsurface.rs
          test -f engine/geolab-core/src/sediment.rs
          test -f engine/geolab-core/src/ecology.rs
          test -f engine/geolab-server/src/lib.rs
          test -f engine/geolab-server/src/main.rs
          test -f engine/geolab-wasm/src/lib.rs
          test -f LICENSE

      - name: Verify canonical changelog
        shell: bash
        run: |
          mapfile -t changelogs < <(git ls-files | grep -Ei '(^|/)CHANGELOG\.md$')
          test "${#changelogs[@]}" -eq 1
          test "${changelogs[0]}" = "CHANGELOG.md"
